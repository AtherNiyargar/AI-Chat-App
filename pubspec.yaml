name: ai_chat_app
description: "An AI chat app!"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.2

dependencies:
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  googleai_dart: ^12.0.1
  material_ui: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon.png"